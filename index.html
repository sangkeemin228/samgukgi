<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>삼국지 유튜브 아카이브</title>
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        th {
            background-color: #f4f4f4;
            color: #555;
            font-weight: 600;
        }
        tr:hover {
            background-color: #fafafa;
        }
        .view-count {
            text-align: center;
            color: #e67e22;
            font-weight: bold;
        }
        .link-btn {
            display: inline-block;
            padding: 6px 12px;
            background-color: #ff0000;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 0.9em;
            transition: background 0.3s;
        }
        .link-btn:hover {
            background-color: #cc0000;
        }
        .center { text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h1>📚 삼국지 유튜브 영상 아카이브</h1>
    <table>
        <thead>
            <tr>
                <th>채널명</th>
                <th>영상 제목</th>
                <th class="center">조회수</th>
                <th class="center">링크</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>침착맨</td>
                <td><strong>침착맨 삼국지 완전판</strong></td>
                <td class="view-count">2792만</td>
                <td class="center"><a href="https://www.youtube.com/watch?v=hnanNlDbsE4" target="_blank" class="link-btn">바로가기</a></td>
            </tr>
            <tr>
                <td>tvN STORY</td>
                <td>설민석의 &lt;삼국지&gt; 강독 풀버전</td>
                <td class="view-count">1752만</td>
                <td class="center"><a href="https://www.youtube.com/watch?v=RcWN4RdnxDQ" target="_blank" class="link-btn">바로가기</a></td>
            </tr>
            <tr>
                <td>디글 :Diggle</td>
                <td>벌거벗은세계사: 이성원 교수 삼국지여행</td>
                <td class="view-count">630만</td>
                <td class="center"><a href="https://www.youtube.com/watch?v=g9nIIzjw_Ag" target="_blank" class="link-btn">바로가기</a></td>
            </tr>
            <tr>
                <td>스밍스</td>
                <td>2010년 신 삼국지 (1회)</td>
                <td class="view-count">2000만</td>
                <td class="center"><a href="https://www.youtube.com/watch?v=6aC7BHOrnyg" target="_blank" class="link-btn">바로가기</a></td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
